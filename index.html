<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <!-- 桌面 + 手机通用：适配刘海屏，允许缩放（电脑上好用） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6fa860" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <title>我的应用</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="ic-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.4-4.5-1.4-6.5 0v13c2-1.4 4.5-1.4 6.5 0 2-1.4 4.5-1.4 6.5 0V6c-2-1.4-4.5-1.4-6.5 0Z"/><path d="M12 6v13"/></symbol>
    <symbol id="ic-note" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></symbol>
    <symbol id="ic-chart" viewBox="0 0 24 24"><path d="M5 19V10M10 19V5M15 19v-7M20 19V9"/></symbol>
    <symbol id="ic-tag" viewBox="0 0 24 24"><path d="M3 12l8-8h7a2 2 0 0 1 2 2v7l-9 9z"/><circle cx="15" cy="8.5" r="1.3"/></symbol>
    <symbol id="ic-doc" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h6M9 18h4"/></symbol>
    <symbol id="ic-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.4 1 2.5h6c0-1.1.3-1.8 1-2.5A6 6 0 0 0 12 3Z"/></symbol>
    <symbol id="ic-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/></symbol>
    <symbol id="ic-wallet" viewBox="0 0 24 24"><path d="M3 7h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7v10a2 2 0 0 0 2 2h13"/><circle cx="17" cy="13" r="1.3"/></symbol>
    <symbol id="ic-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 14v6"/></symbol>
    <symbol id="ic-mood" viewBox="0 0 24 24"><path d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5z"/><path d="M18 14l.9 2.3L21 17l-2.1.7L18 20l-.9-2.3L15 17l2.1-.7z"/></symbol>
    <symbol id="ic-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19c4-4 7-7 11-9"/></symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  </svg>
  <div id="app">
    <!-- 左侧导航抽屉的唤出按钮（默认隐藏抽屉，点此抽出） -->
    <button id="menu-btn" class="icon-btn" type="button" aria-label="打开功能菜单">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><use href="#ic-menu"/></svg>
    </button>
    <!-- 抽屉打开时的遮罩，点它收起 -->
    <div id="side-backdrop"></div>
    <!-- 左侧：功能导航抽屉（默认隐藏，由菜单按钮抽出） -->
    <aside id="sidebar">
      <div id="side-head">
        <h1 id="side-title">我的应用</h1>
        <button id="theme-btn" class="icon-btn" aria-label="切换主题">🌙</button>
      </div>
      <nav id="side-nav"></nav>
      <div id="side-foot">
        <button id="nav-add" class="nav-item" type="button">
          <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-plus"/></svg></span>
          <span class="nav-label">添加功能</span>
        </button>
        <button id="nav-export" class="nav-item" type="button">
          <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-doc"/></svg></span>
          <span class="nav-label">导出数据</span>
        </button>
        <button id="nav-import" class="nav-item" type="button">
          <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-doc"/></svg></span>
          <span class="nav-label">导入数据</span>
        </button>
        <input type="file" id="backup-file" accept="application/json,.json" hidden />
      </div>
    </aside>

    <!-- 右侧：内容区 -->
    <main id="view"></main>
  </div>

  <!-- 1) 先加载核心框架 -->
  <script src="js/app.js"></script>
  <!-- 2) 功能模块（每个 .js = 一个左侧导航项 + 右侧内容） -->
  <script src="js/features/checkin.js"></script>
  <script src="js/features/mood.js"></script>
  <script src="js/features/ledger.js"></script>
  <script src="js/features/sticky.js"></script>
</body>
</html>
