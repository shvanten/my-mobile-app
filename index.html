<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <!-- 桌面 + 手机通用：适配刘海屏，允许缩放（电脑上好用） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6fa860" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <title>我的应用</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 左侧：功能导航单独成列 -->
    <aside id="sidebar">
      <div id="side-head">
        <h1 id="side-title">我的应用</h1>
        <button id="theme-btn" class="icon-btn" aria-label="切换主题">🌙</button>
      </div>
      <nav id="side-nav"></nav>
      <div id="side-foot">
        <button id="nav-add" class="nav-item nav-add" type="button">
          <span class="nav-icon">➕</span>
          <span class="nav-label">添加功能</span>
        </button>
      </div>
    </aside>

    <!-- 右侧：内容区 -->
    <main id="view"></main>
  </div>

  <!-- 1) 先加载核心框架 -->
  <script src="js/app.js"></script>
  <!-- 2) 功能模块（每个 .js = 一个左侧导航项 + 右侧内容） -->
  <script src="js/features/checkin.js"></script>
  <script src="js/features/mood.js"></script>
  <script src="js/features/ledger.js"></script>
  <script src="js/features/sticky.js"></script>
  <!-- 3) 同步（依赖其它功能，必须最后加载） -->
  <script src="js/features/sync.js"></script>
</body>
</html>
